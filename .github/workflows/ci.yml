name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Every dialectTest runs against SQLite and this Postgres.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brainstem
          POSTGRES_PASSWORD: brainstem
          POSTGRES_DB: brainstem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brainstem -d brainstem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BRAINSTEM_TEST_PG_URL: postgres://brainstem:brainstem@127.0.0.1:5432/brainstem_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit and integration tests
        run: npm test

      # Multi-core 2.0 acceptance tests. Tests still marked `todo`
      # report their status without failing the build.
      - name: Acceptance tests
        run: npm run test:acceptance
