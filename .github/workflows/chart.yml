name: Helm chart

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART: charts/brainstem
  HELM_VERSION: v3.19.0
  KUBECONFORM_VERSION: v0.7.0
  # Kubernetes versions the rendered manifests are validated against.
  KUBE_VERSIONS: "1.29.0 1.31.0 1.33.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: helm lint
        run: |
          helm lint "$CHART" --strict --set database.url=postgres://u:p@pg/brainstem
          for values in "$CHART"/ci/*-values.yaml; do
            helm lint "$CHART" --strict -f "$values"
          done

      - name: helm-unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1
          helm unittest "$CHART"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: ct lint
        run: ct lint --charts "$CHART" --validate-maintainers=false --check-version-increment=false

      - name: kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin kubeconform
          mkdir -p rendered
          helm template t "$CHART" --set database.url=postgres://u:p@pg/b \
            --set metrics.serviceMonitor.enabled=true --set metrics.prometheusRule.enabled=true \
            --set metrics.grafanaDashboard.enabled=true --set networkPolicy.enabled=true \
            --set ingress.enabled=true --set api.autoscaling.enabled=true > rendered/full.yaml
          helm template t "$CHART" --set mode=single --set networkPolicy.enabled=true > rendered/single.yaml
          for values in "$CHART"/ci/*-values.yaml; do
            helm template t "$CHART" -f "$values" > "rendered/$(basename "$values")"
          done
          for version in $KUBE_VERSIONS; do
            echo "Kubernetes $version"
            kubeconform -strict -summary -kubernetes-version "$version" \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              rendered/*.yaml
          done

  # Install every ci/*-values.yaml on kind with CloudNativePG and KEDA,
  # using the image built from this commit, then run `helm test`.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Build the image
        run: docker build -t brainstem:ci .

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: brainstem
          wait: 120s

      - name: Load the image and pre-pull the model
        run: |
          kind load docker-image brainstem:ci --name brainstem
          models=$(yq '.models.image.repository + ":" + .models.image.tag' "$CHART/values.yaml")
          docker pull "$models"
          kind load docker-image "$models" --name brainstem

      - name: Install CloudNativePG and KEDA
        run: |
          kubectl apply --server-side -f https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.27.1/cnpg-1.27.1.yaml
          kubectl apply --server-side -f https://github.com/kedacore/keda/releases/download/v2.18.1/keda-2.18.1.yaml
          kubectl -n cnpg-system rollout status deploy/cnpg-controller-manager --timeout=300s
          kubectl -n keda rollout status deploy/keda-operator --timeout=300s

      - name: ct install
        run: |
          ct install --charts "$CHART" \
            --helm-extra-set-args "--set=image.repository=brainstem --set=image.tag=ci --set=image.pullPolicy=Never --set=models.image.pullPolicy=IfNotPresent" \
            --helm-extra-args "--timeout 900s"

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -50
          for pod in $(kubectl get pods -A -l app.kubernetes.io/name=brainstem -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}'); do
            echo "::group::$pod"
            kubectl logs -n "${pod%%/*}" "${pod##*/}" --all-containers --tail=100 || true
            echo "::endgroup::"
          done

  # Releases publish the chart as an OCI artifact next to the images:
  #   helm install brainstem oci://ghcr.io/<owner>/charts/brainstem --version X.Y.Z
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: install
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package "$CHART" --version "$version" --app-version "$version" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/brainstem-${version}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
