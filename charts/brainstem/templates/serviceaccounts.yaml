{{- if .Values.serviceAccount.create }}
{{- $components := list "web" }}
{{- if eq .Values.mode "single" }}
{{- $components = append $components "single" }}
{{- else }}
{{- $components = concat $components (list "api" "core") }}
{{- end }}
{{- range $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "brainstem.fullname" $ }}-{{ . }}
  labels:
    {{- include "brainstem.componentLabels" (dict "root" $ "component" .) | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Brainstem never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
{{- end }}
