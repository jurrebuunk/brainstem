{{- if and .Values.database.url (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "brainstem.fullname" . }}-database
  labels:
    {{- include "brainstem.labels" . | nindent 4 }}
  annotations:
    # The migration hook runs before regular resources exist.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  url: {{ .Values.database.url | quote }}
{{- end }}
{{- if not .Values.api.token.existingSecret }}
{{- $name := include "brainstem.apiTokenSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := .Values.api.token.value }}
{{- if and (not $token) $existing }}
{{- $token = index $existing.data "token" | b64dec }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "brainstem.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Machine token for telemetry (POST /api/events). Kept across upgrades.
  token: {{ default (randAlphaNum 40) $token | quote }}
{{- end }}
