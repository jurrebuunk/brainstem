# ct install: cluster mode on CloudNativePG with split, KEDA-scaled
# core groups and network policies. CI overrides image.* with the
# image built from the branch.
mode: cluster

cnpg:
  enabled: true
  instances: 1
  storage:
    size: 1Gi

api:
  replicas: 1
web:
  replicas: 1

networkPolicy:
  enabled: true

config:
  file: |
    import example from "/app/brainstem.config.example.mjs";

    const {database, logging, api, ...runtime} = example.runtime;

    export default {
      ...example,
      runtime,
      inputs: [{
        id: "ci-static",
        module: "@brainstem-dev/plugin-static-observations",
        intervalMs: 20000,
        config: {
          observations: [{
            id: "ci:disk",
            source: {type: "ci", name: "kind"},
            type: "incident",
            state: "firing",
            title: "Disk full on db-1",
            message: "Postgres on db-1 cannot write: no space left on device. All writes are failing."
          }]
        }
      }]
    };

cores:
  groups:
    - name: poll
      queues: [poll]
      replicas: 1
    - name: decide
      queues: [decide]
      resources:
        requests: {cpu: 250m, memory: 1Gi}
        limits: {memory: 3Gi}
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 2
    - name: deliver
      queues: [deliver]
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 3
  defaults:
    pdb:
      enabled: false
